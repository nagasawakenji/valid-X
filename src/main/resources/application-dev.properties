# spring.profiles.active=dev
spring.config.import=optional:file:.env[.properties]

# PostgreSQL??????
spring.datasource.url=jdbc:postgresql://localhost:5432/validx
spring.datasource.username=validxadmin
spring.datasource.password=postgre
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000

# H2?????
spring.h2.console.enabled=true

# MailHog?????????SMTP?
# ????????????????
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_PROPERTIES_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE}

# ???????
logging.level.org.mybatis=INFO
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG